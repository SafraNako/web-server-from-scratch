[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-server-from-scratch"
version = "0.1.0"
description = "An HTTP/1.1 web server written from scratch on raw sockets in pure Python: strict request parsing, keep-alive and pipelining, chunked bodies, routing and a static file server with conditional requests and ranges, checked against curl, http.client and Apache httpd"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SafraNako" }]
keywords = ["http", "web-server", "sockets", "rfc-9112", "static-files", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SafraNako/web-server-from-scratch"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
kserve = "kendi_sunucu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
